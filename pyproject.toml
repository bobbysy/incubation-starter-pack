[project]
name = "hello-world"
version = "0.1.0"
description = "A simple Python project with pre-commit hooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hello_world"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pylint>=4.0.5",
    "pytest>=8.0.0",
    "ruff>=0.15.10",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "B",    # bugbear
    "B9",
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "PIE",  # flake8-pie
    "PGH",  # pygrep-hooks
    "PYI",  # flake8-pyi
    "RUF",
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "S602", # flake8-bandit: subprocess-popen-with-shell-equals-true
]

ignore = [
    # only relevant if you run a script with `python -0`,
    # which seems unlikely for any of the scripts in this repo
    "B011",
    # Leave it to the formatter to split long lines and
    # the judgement of all of us.
    "E501"
]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "too-few-public-methods",
    "fixme",
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'hello_world')"
load-plugins = ["pylint.extensions.mccabe"]

[tool.pylint.design]
max-complexity = 20

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["hello_world"]
